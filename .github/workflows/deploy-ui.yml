name: Deploy UI

# Direct Cloud Run deploy of the Next.js app in ui/ via Cloud Build,
# then a Firebase Hosting deploy that rewrites all traffic to the
# Cloud Run service. Previously we used Firebase Frameworks' webframeworks
# experiment — it produced a partial server bundle that 404'd on every
# /api/** and RSC path, so we bypass it entirely.

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-ui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: trader-dashboard-tc01
  CLOUD_RUN_SERVICE: ssrtraderdashboardtc01
  CLOUD_RUN_REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/928187273797/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-actions-deploy@trader-dashboard-tc01.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify required Secret Manager secrets exist
        run: |
          set -euo pipefail
          REQUIRED_SECRETS=(
            GENERAL_ALPACA_API_KEY
            GENERAL_ALPACA_SECRET_KEY
            KRAKEN_ALPACA_API_KEY
            KRAKEN_ALPACA_SECRET_KEY
            NEWS_ALPACA_API_KEY
            NEWS_ALPACA_SECRET_KEY
            GITHUB_TOKEN
          )
          missing=()
          for s in "${REQUIRED_SECRETS[@]}"; do
            if ! gcloud secrets describe "$s" --project="$GCP_PROJECT" >/dev/null 2>&1; then
              missing+=("$s")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: the following Secret Manager secrets do not exist in $GCP_PROJECT:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Delete Cloud Run service to clear legacy Firebase Frameworks state
        # Firebase Frameworks left custom annotations (phantom secret refs,
        # base-image tracking, etc.) that `--clear-base-image` alone can't
        # cleanly overwrite. Deleting gives us a guaranteed fresh spec.
        # gcloud run deploy --source recreates the service on the next step.
        # Firebase Hosting's fh-* tag is repaired after.
        run: |
          gcloud run services delete "$CLOUD_RUN_SERVICE" \
            --region="$CLOUD_RUN_REGION" \
            --project="$GCP_PROJECT" \
            --quiet \
            || echo "service did not exist, continuing"

      - name: Build Cloud Run image via Cloud Build and deploy
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          # Write NEXT_PUBLIC_* values to ui/.env.production. Next.js reads
          # this file at build time and inlines them into the client bundle.
          # This is more reliable than gcloud --update-build-env-vars, which
          # only sets Cloud Build step env vars and doesn't translate to
          # Docker --build-arg for Dockerfile builds.
          #
          # Fail fast if any required secret is missing — avoids silently
          # shipping a build with an empty NEXT_PUBLIC_FIREBASE_API_KEY,
          # which is what hit us before (AuthGate refuses to render).
          REQUIRED=( \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID \
          )
          missing=()
          for v in "${REQUIRED[@]}"; do
            if [ -z "${!v:-}" ]; then
              missing+=("$v")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: missing GitHub repo secrets:"
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}"
          } > ui/.env.production
          echo "Wrote ui/.env.production with $(wc -l < ui/.env.production) lines (values redacted)"

          ENV_VARS="GITHUB_REPO_OWNER=thomascortebeeck-kidsnovel"
          ENV_VARS+=",GITHUB_REPO_NAME=trader"
          ENV_VARS+=",GITHUB_REPO_BRANCH=main"
          ENV_VARS+=",ALPACA_BASE_URL=https://paper-api.alpaca.markets"
          ENV_VARS+=",ALPACA_DATA_URL=https://data.alpaca.markets"

          SECRETS="GENERAL_ALPACA_API_KEY=GENERAL_ALPACA_API_KEY:latest"
          SECRETS+=",GENERAL_ALPACA_SECRET_KEY=GENERAL_ALPACA_SECRET_KEY:latest"
          SECRETS+=",KRAKEN_ALPACA_API_KEY=KRAKEN_ALPACA_API_KEY:latest"
          SECRETS+=",KRAKEN_ALPACA_SECRET_KEY=KRAKEN_ALPACA_SECRET_KEY:latest"
          SECRETS+=",NEWS_ALPACA_API_KEY=NEWS_ALPACA_API_KEY:latest"
          SECRETS+=",NEWS_ALPACA_SECRET_KEY=NEWS_ALPACA_SECRET_KEY:latest"
          SECRETS+=",GITHUB_TOKEN=GITHUB_TOKEN:latest"

          # ingress=all + invokerIamDisabled=true:
          #
          # Firebase Hosting's `run:` rewrite historically relied on an
          # fh-* tagged URL created by Firebase Frameworks. Now that we
          # deploy Cloud Run directly, no such tag exists, and the rewrite
          # defaults to the canonical service URL. That URL is blocked by
          # ingress=internal-and-cloud-load-balancing (Firebase Hosting's
          # traffic doesn't qualify as "cloud load balancing" since it
          # doesn't use a GCP HTTP(S) LB).
          #
          # Opening ingress=all lets Firebase Hosting reach the service.
          # Direct public access to the canonical *.run.app URL is still
          # possible but every API route enforces Firebase ID token via
          # firebase-admin verifyIdToken(), so unauthenticated requests
          # get 401. This is acceptable for paper-trading.
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source=ui \
            --project="$GCP_PROJECT" \
            --region="$CLOUD_RUN_REGION" \
            --platform=managed \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=60 \
            --ingress=all \
            --clear-base-image \
            --set-env-vars="$ENV_VARS" \
            --set-secrets="$SECRETS"

      - name: Describe Cloud Run service (diagnostic)
        if: always()
        run: |
          echo "=== service description ==="
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region="$CLOUD_RUN_REGION" \
            --project="$GCP_PROJECT" \
            --format="yaml(metadata.name,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName,status.conditions,spec.template.spec.containers[0].image,spec.template.spec.containers[0].env)" \
            || true
          echo
          echo "=== latest revision readiness ==="
          gcloud run revisions list \
            --service="$CLOUD_RUN_SERVICE" \
            --region="$CLOUD_RUN_REGION" \
            --project="$GCP_PROJECT" \
            --limit=3 \
            --format="table(metadata.name,status.conditions[0].type,status.conditions[0].status,status.conditions[0].message)" \
            || true

      - name: Wait for revision ready + disable invoker IAM
        # Cloud Run `gcloud run deploy --source` returns after the revision
        # is serving, so the container has already started by the time we
        # get here (startup logs in the previous step show "Next.js Ready").
        # We skip the direct-URL test because org policy blocks allUsers,
        # which means we can't curl the canonical URL without an identity
        # token / invoker binding — not worth the complexity just to
        # re-prove what the container startup logs already show.
        #
        # invokerIamDisabled=true lets Firebase Hosting invoke the service
        # without any IAM binding (which org policy forbids via
        # iam.allowedPolicyMemberDomains). With ingress=all set in the
        # deploy step, any request — authenticated or not — reaches the
        # container. Route handlers enforce firebase-admin verifyIdToken,
        # so unauthenticated calls still get 401.
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${CLOUD_RUN_REGION}/services/${CLOUD_RUN_SERVICE}?updateMask=invokerIamDisabled" \
            -d '{"invokerIamDisabled": true}'
          echo
          echo "Verifying invokerIamDisabled is set..."
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${CLOUD_RUN_REGION}/services/${CLOUD_RUN_SERVICE}" \
            | grep -E '"invokerIamDisabled"\s*:\s*true' \
            && echo "OK: invoker IAM check disabled"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Diagnostic — list Firebase Hosting sites
        # Confirms the default site (trader-dashboard-tc01) exists and isn't
        # hiding behind a different site ID. Also reveals if Firebase
        # Frameworks created a secondary site we're unaware of.
        run: |
          set -euo pipefail
          firebase hosting:sites:list --project="$GCP_PROJECT" --json || true

      - name: Deploy Firebase Hosting (rewrites only, no frameworks)
        # We use a marker file with a real (non-dot) name so that Firebase
        # doesn't think the public dir is empty. The previous .keep was
        # matched by "**/.*" in the ignore list, leaving deploy with 0 files.
        # Rewrites still apply via the catch-all in firebase.json.
        # --debug gives us a full deploy manifest on failure.
        working-directory: ui
        run: |
          set -euo pipefail
          mkdir -p public-fh
          echo "Firebase Hosting serving this file means the rewrite to Cloud Run failed." > public-fh/_rewrite-fallback.txt
          firebase deploy --only hosting --project="$GCP_PROJECT" --non-interactive --debug 2>&1 | tail -200

      - name: Diagnostic — list recent Hosting releases
        run: |
          set -euo pipefail
          echo "=== Hosting channels ==="
          firebase hosting:channel:list --project="$GCP_PROJECT" --json 2>&1 | tail -50 || true

      - name: Re-point fh-* tags to latestReady revision
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region="$CLOUD_RUN_REGION" --project="$GCP_PROJECT" --format=json)"
          LATEST_REV="$(echo "$SERVICE_JSON" | jq -r '.status.latestReadyRevisionName')"
          FH_TAGS="$(echo "$SERVICE_JSON" \
            | jq -r '[.spec.traffic[]? | select(.tag != null and (.tag | startswith("fh-"))) | .tag] | join(",")')"
          echo "latestRevision=${LATEST_REV}"
          echo "firebaseHostingTags=${FH_TAGS:-<none>}"
          if [ -n "$FH_TAGS" ]; then
            UPDATE_TAGS=""
            IFS=','
            for tag in $FH_TAGS; do
              [ -n "$UPDATE_TAGS" ] && UPDATE_TAGS="${UPDATE_TAGS},"
              UPDATE_TAGS="${UPDATE_TAGS}${tag}=${LATEST_REV}"
            done
            unset IFS
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --region="$CLOUD_RUN_REGION" \
              --project="$GCP_PROJECT" \
              --update-tags="${UPDATE_TAGS}"
          fi

      - name: Sanity check /api/ping via Firebase Hosting
        run: |
          set -euo pipefail
          URL="https://${GCP_PROJECT}.web.app/api/ping"
          for i in 1 2 3 4 5 6; do
            STATUS="$(curl -s -o /tmp/ping.json -w '%{http_code}' "$URL" || true)"
            echo "attempt $i: GET $URL → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/ping.json
              echo
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: /api/ping did not return 200 via Firebase Hosting after 6 attempts"
          echo
          echo "=== Full response headers for /api/ping ==="
          curl -sSi "$URL" | head -40 || true
          echo
          echo "=== Full response headers for / (root rewrite should also hit CR) ==="
          curl -sSi "https://${GCP_PROJECT}.web.app/" | head -40 || true
          echo
          echo "=== Fallback file (if this is served, rewrite never applied) ==="
          curl -sSi "https://${GCP_PROJECT}.web.app/_rewrite-fallback.txt" | head -20 || true
          echo
          echo "=== Cloud Run service traffic routing ==="
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region="$CLOUD_RUN_REGION" \
            --project="$GCP_PROJECT" \
            --format="yaml(status.url,status.latestReadyRevisionName,spec.traffic,status.traffic)" || true
          echo
          echo "=== last 50 log entries from Cloud Run ==="
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" \
            --limit=50 \
            --format="table(timestamp,severity,textPayload)" \
            || true
          exit 1
