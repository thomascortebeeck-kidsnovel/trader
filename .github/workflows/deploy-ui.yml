name: Deploy UI

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-ui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/928187273797/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-actions-deploy@trader-dashboard-tc01.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Nuke Cloud Run service if it exists (one-time repair)
        # The existing Cloud Run service has phantom UUID secret refs written
        # by Firebase Frameworks that gcloud's client-side parser can't read,
        # so every --update / --clear call crashes with 'Invalid secret path
        # in annotation'. Deleting bypasses the parser entirely (the delete
        # API call doesn't validate annotations on the way out). firebase
        # deploy below then recreates the service clean, and the post-deploy
        # step binds real secrets into the fresh spec.
        #
        # This step is safe to keep running even after repair — if the
        # service is in a healthy state, delete + recreate costs ~30s of
        # extra deploy time but produces identical output.
        run: |
          gcloud run services delete ssrtraderdashboardtc01 \
            --region=europe-west1 \
            --quiet || echo "service did not exist, continuing"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable webframeworks experiment
        run: firebase experiments:enable webframeworks

      - name: Deploy to Firebase Hosting
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: firebase deploy --project=trader-dashboard-tc01 --non-interactive --force

      - name: Bind runtime env vars + secrets on Cloud Run
        # Firebase Frameworks' Next.js integration does not reliably honor
        # frameworksBackend.env / .secrets in firebase.json — we bypass it
        # entirely and configure runtime env directly on Cloud Run here.
        # Runs against the freshly-recreated service, so no phantom refs
        # exist and --set-secrets succeeds on the first call.
        #
        # We pre-verify every secret exists in Secret Manager. If one is
        # missing, `gcloud run services update --set-secrets` accepts the
        # spec but Cloud Run then fails to start the revision — traffic
        # stays on the previous (empty-env) revision and the dashboard
        # silently serves $0. Failing loud here surfaces the real problem.
        run: |
          set -euo pipefail
          PROJECT_ID=trader-dashboard-tc01

          REQUIRED_SECRETS=(
            GENERAL_ALPACA_API_KEY
            GENERAL_ALPACA_SECRET_KEY
            KRAKEN_ALPACA_API_KEY
            KRAKEN_ALPACA_SECRET_KEY
            NEWS_ALPACA_API_KEY
            NEWS_ALPACA_SECRET_KEY
            GITHUB_TOKEN
          )

          missing=()
          for s in "${REQUIRED_SECRETS[@]}"; do
            if ! gcloud secrets describe "$s" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              missing+=("$s")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: the following Secret Manager secrets do not exist in ${PROJECT_ID}:"
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "Create them first. Example:"
            echo "  printf 'PKxxxx...' | gcloud secrets create GENERAL_ALPACA_API_KEY --project=${PROJECT_ID} --data-file=-"
            echo
            echo "Or, if they exist in another project, grant this project's Cloud Run"
            echo "service account roles/secretmanager.secretAccessor on each secret."
            exit 1
          fi

          gcloud run services update ssrtraderdashboardtc01 \
            --region=europe-west1 \
            --update-env-vars="GITHUB_REPO_OWNER=thomascortebeeck-kidsnovel,GITHUB_REPO_NAME=trader,GITHUB_REPO_BRANCH=main,ALPACA_BASE_URL=https://paper-api.alpaca.markets,ALPACA_DATA_URL=https://data.alpaca.markets" \
            --set-secrets="GENERAL_ALPACA_API_KEY=GENERAL_ALPACA_API_KEY:latest,GENERAL_ALPACA_SECRET_KEY=GENERAL_ALPACA_SECRET_KEY:latest,KRAKEN_ALPACA_API_KEY=KRAKEN_ALPACA_API_KEY:latest,KRAKEN_ALPACA_SECRET_KEY=KRAKEN_ALPACA_SECRET_KEY:latest,NEWS_ALPACA_API_KEY=NEWS_ALPACA_API_KEY:latest,NEWS_ALPACA_SECRET_KEY=NEWS_ALPACA_SECRET_KEY:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest"

          # Verify the latest revision is actually serving 100% traffic. If
          # it isn't, the container failed to start (most likely cause:
          # IAM can't access one of the secrets).
          LATEST_READY_REV="$(gcloud run services describe ssrtraderdashboardtc01 \
            --region=europe-west1 \
            --format='value(status.latestReadyRevisionName)')"
          TRAFFIC_REV="$(gcloud run services describe ssrtraderdashboardtc01 \
            --region=europe-west1 \
            --format='value(status.traffic[0].revisionName)')"
          echo "latestReadyRevision=${LATEST_READY_REV}"
          echo "trafficRevision=${TRAFFIC_REV}"
          if [ "${LATEST_READY_REV}" != "${TRAFFIC_REV}" ]; then
            echo "ERROR: latest ready revision is not serving traffic — new revision likely crashed on startup."
            echo "Grant roles/secretmanager.secretAccessor to the Cloud Run runtime SA on each secret, or check revision logs."
            exit 1
          fi

      - name: Allow Firebase Hosting to invoke Cloud Run (no-IAM-check mode)
        # Background: the usual `firebase deploy` binding is
        # allUsers -> roles/run.invoker, which this project's org policy
        # `iam.allowedPolicyMemberDomains` (kidsnovel.com Workspace)
        # refuses because allUsers is outside the allowed domain.
        #
        # Previous attempt: bind run.invoker to the Firebase Hosting P4SA
        # `service-PROJECT_NUMBER@gcp-sa-firebasehosting.iam.gserviceaccount.com`.
        # That P4SA cannot be provisioned in this project — the Service
        # Usage `generateServiceIdentity` endpoint returns
        # IAM_SERVICE_NOT_CONFIGURED_FOR_IDENTITIES for
        # firebasehosting.googleapis.com. Binding a role to an SA that
        # doesn't exist fails with INVALID_ARGUMENT.
        #
        # Current approach (Google's recommended workaround for DRS-
        # enforced projects): disable the Cloud Run invoker IAM check on
        # the service itself. With ingress locked to
        # internal-and-cloud-load-balancing, security is enforced at L4:
        #  - Direct hits to the *.run.app URL fail at the network gate.
        #  - Firebase Hosting's managed load balancer reaches the
        #    service and, because invoker IAM is disabled, the request
        #    is served.
        # No IAM binding is created, so the org policy never evaluates.
        #
        # Implemented via the Cloud Run v2 REST API (no `beta` gcloud
        # component needed on setup-gcloud@v2).
        run: |
          set -euo pipefail
          PROJECT_ID=trader-dashboard-tc01
          REGION=europe-west1
          SERVICE=ssrtraderdashboardtc01

          gcloud run services update "${SERVICE}" \
            --region="${REGION}" \
            --ingress=internal-and-cloud-load-balancing

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}?updateMask=invokerIamDisabled" \
            -d '{"invokerIamDisabled": true}'
          echo

          echo "Verifying invokerIamDisabled is set..."
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}" \
            | grep -E '"invokerIamDisabled"\s*:\s*true' \
            && echo "OK: invoker IAM check disabled"

      - name: Dump final Cloud Run env for sanity check
        run: |
          gcloud run services describe ssrtraderdashboardtc01 \
            --region=europe-west1 \
            --format="yaml(spec.template.spec.containers[0].env,spec.template.spec.containers[0].image)"
