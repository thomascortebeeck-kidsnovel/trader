name: News Poller — Event Trigger

# Fires every 5 minutes from pre-market through close.
# Polls Alpaca News (micro, watchlist tickers) and Finnhub (macro,
# general/forex categories), applies a deterministic layer-1 filter,
# and POSTs surviving items to the Claude Routine API trigger.
# The routine does full importance scoring + trade decision (layer-2).
#
# Required GitHub repository secrets:
#   NEWS_ALPACA_API_KEY          — Alpaca paper key for news-based account
#   NEWS_ALPACA_SECRET_KEY       — Alpaca paper secret
#   FINNHUB_API_KEY              — Finnhub API key (shared across bots)
#   NEWS_ROUTINE_TRIGGER_URL     — from claude.ai/code → routine → Add trigger → API
#   NEWS_ROUTINE_TOKEN           — bearer token from same page
#
# Optional repository variables (Settings → Variables):
#   NEWS_DRY_RUN         — set to "true" to log but not fire the routine
#   NEWS_LOOKBACK_MIN    — minutes of news history per poll (default 10)

on:
  schedule:
    # Every 5 min, 11:00-20:59 UTC = ~07:00-16:59 ET (covers EDT pre-market through close)
    - cron: '*/5 11-20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log but do not fire routine)'
        required: false
        default: 'false'

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set date for cache key
        run: echo "TODAY=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore poller state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/news_poller_state.json
          key: news-poller-state-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            news-poller-state-${{ env.TODAY }}-

      - name: Run news poller
        env:
          NEWS_ALPACA_API_KEY: ${{ secrets.NEWS_ALPACA_API_KEY }}
          NEWS_ALPACA_SECRET_KEY: ${{ secrets.NEWS_ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_ROUTINE_TRIGGER_URL: ${{ secrets.NEWS_ROUTINE_TRIGGER_URL }}
          NEWS_ROUTINE_TOKEN: ${{ secrets.NEWS_ROUTINE_TOKEN }}
          POLLER_STATE_FILE: /tmp/news_poller_state.json
          WATCHLIST_FILE: bots/news-based/watchlist.md
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.NEWS_DRY_RUN || 'false' }}
          NEWS_LOOKBACK_MIN: ${{ vars.NEWS_LOOKBACK_MIN || '10' }}
        run: python scripts/news_poller.py

      - name: Save poller state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/news_poller_state.json
          key: news-poller-state-${{ env.TODAY }}-${{ github.run_id }}
