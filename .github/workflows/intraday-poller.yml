name: Intraday Poller — Kraken Day Trader

# Fires every 5 minutes during market hours (ET).
# Detects intraday events (OR complete, VWAP cross, volume spike,
# position milestone) and POSTs to the Claude Routine API trigger.
# The routine does the actual pattern recognition and trade decision.
#
# Required GitHub repository secrets:
#   KRAKEN_ALPACA_API_KEY        — Alpaca paper key for day-trader-kraken account
#   KRAKEN_ALPACA_SECRET_KEY     — Alpaca paper secret
#   KRAKEN_ROUTINE_TRIGGER_URL   — from claude.ai/code → routine → Add trigger → API
#   KRAKEN_ROUTINE_TOKEN         — bearer token from same page
#
# Optional repository variables (Settings → Variables):
#   INTRADAY_DRY_RUN   — set to "true" to log events without firing the routine

on:
  schedule:
    # Every 5 min, 13:00-20:59 UTC = ~09:00-16:59 ET (covers EDT; shifts 1h in EST)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log but do not fire routine)'
        required: false
        default: 'false'

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set date for cache key
        run: echo "TODAY=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore poller state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/kraken_poller_state.json
          key: kraken-poller-state-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            kraken-poller-state-${{ env.TODAY }}-

      - name: Run intraday poller
        env:
          KRAKEN_ALPACA_API_KEY: ${{ secrets.KRAKEN_ALPACA_API_KEY }}
          KRAKEN_ALPACA_SECRET_KEY: ${{ secrets.KRAKEN_ALPACA_SECRET_KEY }}
          KRAKEN_ROUTINE_TRIGGER_URL: ${{ secrets.KRAKEN_ROUTINE_TRIGGER_URL }}
          KRAKEN_ROUTINE_TOKEN: ${{ secrets.KRAKEN_ROUTINE_TOKEN }}
          POLLER_STATE_FILE: /tmp/kraken_poller_state.json
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.INTRADAY_DRY_RUN || 'false' }}
        run: python scripts/intraday_poller.py

      - name: Save poller state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/kraken_poller_state.json
          key: kraken-poller-state-${{ env.TODAY }}-${{ github.run_id }}
